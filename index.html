<!doctype html>
<html>
  <head>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultratech Training Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: 'var(--c-s50)', 100: 'var(--c-s100)', 200: 'var(--c-s200)', 300: 'var(--c-s300)', 400: 'var(--c-s400)', 
                500: 'var(--c-s500)', 600: 'var(--c-s600)', 700: 'var(--c-s700)', 800: 'var(--c-s800)', 900: 'var(--c-s900)',  
              },
              white: 'var(--c-white)',
              black: 'var(--c-black)',
              teal: {
                50: 'var(--c-t50)', 100: 'var(--c-t100)', 200: 'var(--c-t200)', 300: 'var(--c-t300)', 400: 'var(--c-t400)', 
                500: 'var(--c-t500)', 600: 'var(--c-t600)', 700: 'var(--c-t700)', 800: 'var(--c-t800)', 900: 'var(--c-t900)',
              },
              amber: {
                50: 'var(--c-a50)', 100: 'var(--c-a100)', 200: 'var(--c-a200)', 300: 'var(--c-a300)', 400: 'var(--c-a400)',
                500: 'var(--c-a500)', 600: 'var(--c-a600)', 700: 'var(--c-a700)', 800: 'var(--c-a800)', 900: 'var(--c-a900)',
              },
              orange: {
                50: 'var(--c-o50)', 100: 'var(--c-o100)', 200: 'var(--c-o200)', 300: 'var(--c-o300)', 400: 'var(--c-o400)',
                500: 'var(--c-o500)', 600: 'var(--c-o600)', 700: 'var(--c-o700)', 800: 'var(--c-o800)', 900: 'var(--c-o900)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --c-white: #ffffff;
        --c-black: #000000;
        --c-s50: #f8fafc; --c-s100: #f1f5f9; --c-s200: #e2e8f0; --c-s300: #cbd5e1; --c-s400: #94a3b8;
        --c-s500: #64748b; --c-s600: #475569; --c-s700: #334155; --c-s800: #1e293b; --c-s900: #0f172a;
        --c-t50: #fffbeb; --c-t100: #fef3c7; --c-t200: #fde68a; --c-t300: #fcd34d; --c-t400: #fbbf24;
        --c-t500: #f59e0b; --c-t600: #d97706; --c-t700: #b45309; --c-t800: #92400e; --c-t900: #78350f;
        --c-a50: #fffbeb; --c-a100: #fef3c7; --c-a200: #fde68a; --c-a300: #fcd34d; --c-a400: #fbbf24;
        --c-a500: #f59e0b; --c-a600: #d97706; --c-a700: #b45309; --c-a800: #92400e; --c-a900: #78350f;
        --c-o50: #fff7ed; --c-o100: #ffedd5; --c-o200: #fed7aa; --c-o300: #fdba74; --c-o400: #fb923c;
        --c-o500: #f97316; --c-o600: #ea580c; --c-o700: #c2410c; --c-o800: #9a3412; --c-o900: #7c2d12;
      }
      .dark {
        --c-white: #000000;
        --c-black: #ffffff;
        --c-s50: #09090b; --c-s100: #18181b; --c-s200: #27272a; --c-s300: #3f3f46; --c-s400: #52525b;
        --c-s500: #71717a; --c-s600: #a1a1aa; --c-s700: #d4d4d8; --c-s800: #e4e4e7; --c-s900: #f4f4f5;
        --c-t50: #451a03; --c-t100: #78350f; --c-t200: #92400e; --c-t300: #b45309; --c-t400: #d97706;
        --c-t500: #f59e0b; --c-t600: #fbbf24; --c-t700: #fcd34d; --c-t800: #fde68a; --c-t900: #fef3c7;
        --c-a50: #451a03; --c-a100: #78350f; --c-a200: #92400e; --c-a300: #b45309; --c-a400: #d97706;
        --c-a500: #f59e0b; --c-a600: #fbbf24; --c-a700: #fcd34d; --c-a800: #fde68a; --c-a900: #fef3c7;
        --c-o50: #431407; --c-o100: #7c2d12; --c-o200: #9a3412; --c-o300: #c2410c; --c-o400: #ea580c;
        --c-o500: #f97316; --c-o600: #fb923c; --c-o700: #fdba74; --c-o800: #fed7aa; --c-o900: #ffedd5;
      }
      body { background-color: var(--c-s50); color: var(--c-s900); }
      .dark body { background-color: #000; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
